# 生产配置模板（compose 挂载，只读）。敏感项由环境变量
# C3API_ADMIN_TOKEN / C3API_DB_DSN / C3API_AUTH_JWT_SECRET 注入覆盖（见 compose.yml），
# 此处留空即可。配置仅启动时读取，变更需滚动重启（无热更新）。
server = { addr = ":18080", read_header_timeout = "10s", max_header_bytes = 1048576 }
log = { level = "info", output = "stdout" }
# admin.token 可选——空 = 不启用静态 token，/admin 仅接受 platform_admin JWT
# （首个注册用户自动成为 platform_admin，注册后即可登录管理面）
admin = { token = "" }
# JWT 密钥（强制——缺失启动失败；生产必须经 env C3API_AUTH_JWT_SECRET 注入，
# 随机生成 = 重启全失效 + 多实例不一致）
auth = { jwt_secret = "" }
db = { dsn = "", max_conns = 20 }
proxy = {
  max_body_size = 4194304,
  max_inflight = 50000,
  upstream_timeout = "120s",
  upstream_stream_timeout = "30m",
  failover_attempts = 3,
  usage_capture = true,
}
upstream = {
  max_idle_conns = 8192,
  max_idle_conns_per_host = 2048,
  idle_conn_timeout = "90s",
  dial_timeout = "10s",
  force_http2 = true,
}
limit = { group_key_rpm = 0 }
# cooldown_429 / backoff_base / backoff_max 已移除（2026-08-13 用户裁决：不向后
# 兼容）——配置含这些键将启动失败；429 冷却与错误退避由规则引擎（种子规则 +
# /admin/rules 自定义规则）接管。
scheduler = {
  default_max_concurrency = 8,
  sync_interval = "30s",
}
usage = {
  batch_size = 500,
  flush_interval = "500ms",
  # usagelog 按日分区保留天数（Phase 5 T4.5）：保留期外分区由 retention worker
  # DROP TABLE O(1) 清理（默认 30 天 = 30 个日分区）；<= 0 = 不删除。
  log_retention_days = 30,
  # quota 回写 cadence（spec 2026-08-14：统计 flush 删除后仅驱动额度增量回写）。
  quota_flush_interval = "10s",
  # 离线聚合周期（spec 2026-08-14 使用量统计离线聚合化）：独立 worker 每周期
  # 从 usage_logs/err_logs 重建 usage_stats（两范围 + 三查询 + 单事务
  # DELETE+INSERT+watermark）；0 = 禁用聚合。统计分钟级陈旧（接受）。
  stats_agg_interval = "5m",
  # flush_workers：明细/额度 flush 并行 worker 数（默认 8——多角度压测
  # C 项实证 2026-08-12：多用户水线告警清零、pending 斜率降 25-40%、QPS/CPU
  # 零回退；每 worker 一笔批量 SQL，受 DB 连接池余量 db.max_conns 约束；
  # 同 key 恒同 worker，分片确定性）。
  flush_workers = 8,
  # err_logs 错误审计明细（分表设计）：有界队列 + 背压采样丢弃——拒绝风暴不
  # 阻塞热路径/不爆内存/不淹没 DB（DB 写速率上界 = errlog_batch_size /
  # errlog_flush_interval）。双轨行（abort 等已计费错误）豁免采样恒落盘。
  # errlog_queue_size = 4096,          # 拒绝队列容量（满 → 丢弃采样）
  # errlog_batch_size = 500,           # 每批落盘行数
  # errlog_flush_interval = "500ms",   # 批间隔
  # errlog_retention_days = 7,         # err_logs 分区保留天数（默认 7 天短保留）
  # stats_retention_days = 180,        # usage_stats 分区保留天数（默认 180 天；
  #                                    # 聚合统计也分区化——清理 DROP 分区 O(1)，
  #                                    # PG DELETE 不释放空间）
}
# 计费（Phase 5）：默认关 opt-in。启用前需先同步价格（POST /admin/pricing/sync），
# 空价格表 = 全模型 402。启用后：请求前余额预检（快照缺失或 ≤0 → 402）、
# 临时额度 FEFO 优先扣、条件扣费允许透支、优雅停机排空不丢计费。
# flush_interval：扣费批量落库周期（pending 聚合满或周期到 → 逐 user 小事务
# 条件扣费；停机排空受 shutdown 预算约束，超时 Warn 截断不阻塞退出）。
# flush_workers：并行落库 worker 数（默认 8——多角度压测 C 项实证 2026-08-12：
# 多用户水线告警清零、pending 斜率降 25-40%、QPS/CPU 零回退；每 worker 一笔
# DeductAndLog 事务，受 DB 连接池余量 db.max_conns 约束，同用户实例内恒串行）。
# 注：compose 未注入 C3API_BILLING_*（env 覆盖能力存在，可按需注入），开关/参数
# 经挂载的 config.toml 文件修改生效。
billing = { enabled = false, flush_interval = "1s", balance_refresh_interval = "10s", flush_workers = 8 }
