{{- $minReplicas := .Values.replicaCount -}}
{{- if .Values.autoscaling.enabled -}}
{{- $minReplicas = .Values.autoscaling.minReplicas -}}
{{- end -}}
{{- if and .Values.podDisruptionBudget.enabled (eq (int $minReplicas) 1) }}
{{- fail "podDisruptionBudget.enabled=true requires more than one replica: a PDB with minAvailable=1 and a single replica blocks all voluntary evictions (raise replicaCount or autoscaling.minReplicas)" }}
{{- end }}
{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "c3api.fullname" . }}
  labels:
    {{- include "c3api.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "c3api.selectorLabels" . | nindent 6 }}
{{- end }}
