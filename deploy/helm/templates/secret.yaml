{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "c3api.fullname" . }}
  labels:
    {{- include "c3api.labels" . | nindent 4 }}
type: Opaque
stringData:
  auth-jwt-secret: {{ required "secrets.jwtSecret is required when secrets.create=true" .Values.secrets.jwtSecret | quote }}
  {{- if .Values.secrets.adminToken }}
  admin-token: {{ .Values.secrets.adminToken | quote }}
  {{- end }}
{{- end }}
