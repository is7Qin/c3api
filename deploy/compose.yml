# github.com/is7qin/c3api 部署编排：单应用容器（内嵌前端）+ PostgreSQL。
# volume 全部使用目录挂载（bind mount），数据与配置落盘在宿主，便于备份与升级。
#
# 用法：
#   cp .env.example .env（并填写 ADMIN_TOKEN / AUTH_JWT_SECRET 等，见文件内注释）
#   docker compose --env-file .env -f deploy/compose.yml up -d --build
#   # 或临时注入：ADMIN_TOKEN=$(openssl rand -hex 16) AUTH_JWT_SECRET=$(openssl rand -hex 32) \
#   #   docker compose -f deploy/compose.yml up -d --build
#   # 注意：compose v2.24+ 用 -f 时项目目录为 deploy/（.env 在根目录），须显式
#   #   --env-file .env 才能读到根目录 .env（自动读取仅限 deploy/ 下的 .env）。
#
# GHCR 快速上手（预构建镜像，release 流水线发布）：docker pull ghcr.io/is7qin/c3api:beta
#   （:beta 为浮动 tag = 最新 beta；版本固定用 ghcr.io/is7qin/c3api:v0.0.1-beta.1）

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-c3api}
      POSTGRES_DB: c3api
    volumes:
      # 目录挂载：PG 数据落盘宿主 ./data/pg（备份/迁移直接拷目录）。
      # PG 18+ 要求挂载 /var/lib/postgresql（数据在 data 子目录，支持 pg_upgrade --link）
      - ./data/pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d c3api"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    # 镜像双形态（REL spec 2026-08-15）：本地开发/自建用 build（下方 build 块；
    # compose 语义 image+build 并存时 build 优先）；生产用 pull——删除 build 块、
    # 保留 image 即直接跑 GHCR 预构建镜像（docker compose pull && up -d）。
    image: ghcr.io/is7qin/c3api:beta
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 敏感项走环境变量（config.Load 支持 C3API_ADMIN_TOKEN / C3API_DB_DSN / C3API_AUTH_JWT_SECRET 覆盖）
      C3API_ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env (openssl rand -hex 16)}
      C3API_AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in .env (openssl rand -hex 32)}
      C3API_DB_DSN: postgres://postgres:${POSTGRES_PASSWORD:-c3api}@db:5432/c3api?sslmode=disable
    ports:
      - "${PORT:-18080}:18080"
    volumes:
      # 目录挂载：配置只读注入（改配置重启即生效，不用重建镜像）
      - ./config.toml:/app/config.toml:ro
    healthcheck:
      # /healthz 为无鉴权存活端点（internal/server/server.go）；基镜像 alpine:3.20
      # 自带 busybox wget（无 curl），非 root 用户可执行。
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:18080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
