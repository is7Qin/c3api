name: CI

on:
  push:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: c3api_test
          POSTGRES_PASSWORD: c3api
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: authorise private modules
        env:
          CODEX_SDK_TOKEN: ${{ secrets.CODEX_SDK_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CODEX_SDK_TOKEN}" ]; then
            # 按属主前缀授权，覆盖 is7Qin 名下**全部**私有模块（codex-sdk、bps-sdk，
            # 以及下一个）：逐包列举漏过一次——bps-sdk 并进来时 CI 全线拉不到包。
            go env -w GOPRIVATE=github.com/is7Qin
            git config --global url."https://x-access-token:${CODEX_SDK_TOKEN}@github.com/is7Qin".insteadOf "https://github.com/is7Qin"
          fi
      - name: vet
        run: go vet ./...
      - name: no static admin token residue
        # A6（spec 2026-10-09 §4.7）：静态管理 token 机制全量删除；对受跟踪文件
        # 搜残留（排除 .omo/** 设计叙述；放行 CHANGELOG.md 历史条目；排除本文件自身
        # ——它含搜索模式的字面量，否则会自匹配导致本步恒失败）。
        run: |
          set -euo pipefail
          hits=$(git ls-files -z | xargs -0 rg -n --no-heading \
            --glob '!.omo/**' --glob '!CHANGELOG.md' --glob '!.github/workflows/ci.yml' \
            'ADMIN_TOKEN|adminToken|AdminToken|admin-token|admin\.token' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::static admin token residue found (see above)"
            exit 1
          fi
      - name: build
        run: go build ./...
      - name: test
        env:
          TEST_DATABASE_URL: "postgres://postgres:c3api@localhost:5432/c3api_test?sslmode=disable"
          # 迁移地基的 TestMain 闸门：CI 里 PG 必须真跑，缺 DSN 时直接失败而不是
          # 让 migrate/catalog/gen/gen-cmd 的 PG 用例静默 SKIP 出一份假绿报告。
          # 必须叫 TEST_* 而不是 C3API_*：internal/config/config.go:250 把 C3API_
          # 前缀的**所有** env 映射成配置键，C3API_REQUIRE_PG 会被解析成 unknown
          # key `require`，让 internal/config 整包测试失败。
          TEST_REQUIRE_PG: "1"
        # scripts/test.sh gives every PG test its own clone of one migrated
        # template database (CREATE DATABASE ... TEMPLATE), so package test
        # binaries run concurrently again — the old -p 1 serialisation is gone.
        # It also gates the no-t.Parallel() discipline.
        run: scripts/test.sh -count=1
        timeout-minutes: 30

  contract-gen:
    name: contract-gen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: authorise private modules
        env:
          CODEX_SDK_TOKEN: ${{ secrets.CODEX_SDK_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CODEX_SDK_TOKEN}" ]; then
            # 按属主前缀授权，覆盖 is7Qin 名下**全部**私有模块（codex-sdk、bps-sdk，
            # 以及下一个）：逐包列举漏过一次——bps-sdk 并进来时 CI 全线拉不到包。
            go env -w GOPRIVATE=github.com/is7Qin
            git config --global url."https://x-access-token:${CODEX_SDK_TOKEN}@github.com/is7Qin".insteadOf "https://github.com/is7Qin"
          fi
      - name: go generate (handler + ent)
        run: go generate ./internal/handler/ ./internal/ent/
      - name: no drift in api.gen.go / ent generated code
        run: git diff --exit-code -- internal/handler/api.gen.go internal/handler/user/api.gen.go internal/handler/supplier/api.gen.go internal/ent
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: gen:api
        run: pnpm gen:api
        working-directory: web
      - name: no drift in schema.d.ts
        run: git diff --exit-code -- web/src/lib/api/schema.d.ts

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: build
        run: pnpm run build
        working-directory: web

  # Helm 契约此前只靠 Go 文本门 TestDeployMigrateJobAndProbes 盯着：`helm template`
  # 从没在 CI 里跑过，chart 渲染回归（迁移 hook Job 消失、探针路径写错、把
  # -allow-contract 塞进迁移 Job）要等发到集群才暴露。这里用真实渲染断言同一组
  # 契约，零额外依赖：只要 helm 与 grep，不装 yq。
  helm:
    name: helm
    runs-on: ubuntu-latest
    env:
      # values.yaml 故意把这些键留空（模板用 `required` 强制调用方提供），断言只
      # 需要结构能渲染出来，所以这里是**占位值，不是真实凭据**。
      HELM_RENDER_ARGS: >-
        --set-string externalDatabase.dsn=postgres://ci:placeholder@db:5432/c3api?sslmode=disable
        --set-string externalRedis.addr=redis:6379
        --set-string secrets.jwtSecret=ci-placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      - name: helm lint
        # lint 单独不够：`required` 取不到值只被降级成 INFO 日志，lint 仍退出 0
        # （helm v3.16.3 实测）。它管的是 chart 结构与 values.schema.json，契约
        # 断言交给下一步的真实渲染。
        run: |
          set -f  # --set 的值含 `?`，只做分词，不当 glob 展开
          helm lint deploy/helm ${HELM_RENDER_ARGS}
      - name: render assertions
        run: |
          set -euo pipefail
          set -f  # 同上

          work=$(mktemp -d)
          fail() {
            echo "::error::$1"
            echo '--- rendered manifest ---'
            cat "$2"
            exit 1
          }

          echo '==> render the chart with the default values'
          helm template c3api deploy/helm ${HELM_RENDER_ARGS} >"$work/default.yaml"

          echo '==> a) default values render the migration Job, args are exactly -migrate up'
          grep -q '^kind: Job$' "$work/default.yaml" ||
            fail 'a) no Job rendered: templates/job-migrate.yaml produced nothing' "$work/default.yaml"
          grep -A1 -e '- "-migrate"' "$work/default.yaml" | grep -q -e '- "up"' ||
            fail 'a) migration Job args are not "-migrate up"' "$work/default.yaml"
          if grep -q 'allow-contract' "$work/default.yaml"; then
            fail 'a) migration Job must never pass -allow-contract' "$work/default.yaml"
          fi

          echo '==> b) migrations.job.enabled=false drops the Job'
          helm template c3api deploy/helm ${HELM_RENDER_ARGS} \
            --set migrations.job.enabled=false >"$work/no-migrate.yaml"
          if grep -q '^kind: Job$' "$work/no-migrate.yaml"; then
            fail 'b) Job is still rendered with migrations.job.enabled=false' "$work/no-migrate.yaml"
          fi
          if grep -q -e '- "-migrate"' "$work/no-migrate.yaml"; then
            fail 'b) migration args are still rendered with migrations.job.enabled=false' "$work/no-migrate.yaml"
          fi

          echo '==> c) Deployment: readiness=/readyz, liveness=/healthz, maxUnavailable=0'
          grep -A3 'readinessProbe:' "$work/default.yaml" | grep -q 'path: /readyz' ||
            fail 'c) readinessProbe does not point at /readyz' "$work/default.yaml"
          grep -A3 'livenessProbe:' "$work/default.yaml" | grep -q 'path: /healthz' ||
            fail 'c) livenessProbe does not point at /healthz' "$work/default.yaml"
          grep -A1 'rollingUpdate:' "$work/default.yaml" | grep -qE '^[[:space:]]*maxUnavailable: 0$' ||
            fail 'c) strategy.rollingUpdate.maxUnavailable is not 0' "$work/default.yaml"

          echo '==> all chart contracts hold'
