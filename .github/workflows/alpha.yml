name: Alpha

# 每次 push 自动出 alpha 镜像（开发预览，不打正式 tag）
# 复用 release 多平台构建范式：--platform=$BUILDPLATFORM 原生编译前端避 QEMU
on:
  push:
    branches:
      - main

permissions:
  packages: write

concurrency:
  group: alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: image (GHCR alpha)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push alpha
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha, scope=c3api-alpha-build
          cache-to: type=gha, mode=max, scope=c3api-alpha-build
          tags: |
            ghcr.io/is7qin/c3api:alpha
          build-args: |
            C3API_VERSION=alpha-${{ github.sha }}
