name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# pull_request_target runs with the base repository's token — scope is minimized to
# what the CLA Assistant action requires (in-repo signature storage on the
# cla-signatures branch, PR comments, and commit status). Nothing else runs here.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@58daaf842ac3e26d08c2bdf26770d6e9c5b965a9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/is7Qin/c3api/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'dependabot[bot],renovate[bot],github-actions[bot]'
          lock-pullrequest-aftermerge: false
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-notsigned-prcomment: |
            Thanks for your contribution!

            Please sign the Contributor License Agreement before we can merge this pull request:

            1. Read the CLA: https://github.com/is7Qin/c3api/blob/main/CLA.md
            2. Post a comment on this pull request containing exactly:

               I have read the CLA Document and I hereby sign the CLA

            The CLA is required so your contribution can be merged under c3api's dual-license scheme (AGPL-3.0-or-later + commercial). It is voluntary, you sign only once, and it applies to all your future contributions.
          custom-allsigned-prcomment: |
            All contributors have signed the CLA. Thank you!
