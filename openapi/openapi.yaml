openapi: 3.0.3
info:
  title: github.com/is7qin/c3api Admin API
  version: 1.0.0
  description: '管理端 API（模板/账号/分组/规则/日志/统计）。认证：Authorization: Bearer <admin_token>。'
servers:
  - url: /api/admin
tags:
  - name: templates
  - name: accounts
  - name: groups
  - name: keys
  - name: users
  - name: rules
  - name: logs
  - name: stats
  - name: redemptions
  - name: pricing
  - name: ops
paths:
  /templates:
    post:
      operationId: PostTemplates
      tags: [templates]
      summary: 创建模板
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateCreate' }
      responses:
        '200':
          description: 创建后的模板
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: GetTemplates
      tags: [templates]
      summary: 模板列表（分页/筛选/排序）
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 200, description: 每页条数（上限 200，超限裁剪到 200） } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: name, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200':
          description: 模板列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateListResponse' }
        default:
          $ref: '#/components/responses/Error'
  /templates/batch-delete:
    post:
      operationId: PostTemplatesBatchDelete
      tags: [templates]
      summary: 批量删除模板（事务，全成或全败）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchDeleteBody' }
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchDeleteResponse' }
        default:
          $ref: '#/components/responses/Error'
  /templates/batch-update:
    post:
      operationId: PostTemplatesBatchUpdate
      tags: [templates]
      summary: 批量更新模板（fields 为任意字段子集）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchUpdateTemplatesBody' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchUpdateResponse' }
        default:
          $ref: '#/components/responses/Error'
  /templates/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: GetTemplatesId
      tags: [templates]
      responses:
        '200':
          description: 模板
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: PutTemplatesId
      tags: [templates]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateCreate' }
      responses:
        '200':
          description: 更新后模板
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: DeleteTemplatesId
      tags: [templates]
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedResponse' }
        default:
          $ref: '#/components/responses/Error'
  /templates/{id}/ext:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: GetTemplatesIdExt
      tags: [templates]
      summary: 读取模板类型化扩展（编辑回显；仅生态三类型模板有 ext 行）
      responses:
        '200':
          description: 模板 ext 配置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateExt' }
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: PutTemplatesIdExt
      tags: [templates]
      summary: 幂等写入模板类型化扩展（Create/Update 合一；全列更新含 NULL 清空）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateExt' }
      responses:
        '200':
          description: 写入后的 ext 配置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateExt' }
        default:
          $ref: '#/components/responses/Error'
  /accounts:
    post:
      operationId: PostAccounts
      tags: [accounts]
      summary: 创建账号
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCreate' }
      responses:
        '200':
          description: 创建后的账号
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: GetAccounts
      tags: [accounts]
      summary: 账号列表（分页/筛选/排序，含运行时视图）
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 200, description: 每页条数（上限 200，超限裁剪到 200） } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: name, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: status, in: query, schema: { type: string, description: "多值逗号分隔：active,unhealthy,429,disabled" } }
        - { name: template_id, in: query, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 账号视图列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountListResponse' }
        default:
          $ref: '#/components/responses/Error'
  /accounts/usage:
    get:
      operationId: GetAccountsUsage
      tags: [accounts]
      summary: 账号用量聚合（统一 usage API——批量 ≤100 条；from/to 缺省 = 当天）
      parameters:
        - { name: account_ids, in: query, required: true, schema: { type: string, description: "逗号分隔账号 id（1-100 条；重复 id 自动去重——响应 item 唯一；空/非数字/超限 → 400）" } }
        - { name: from, in: query, schema: { type: string, format: date-time, description: "RFC3339 起始（含）；缺省 = UTC 当日零点" } }
        - { name: to, in: query, schema: { type: string, format: date-time, description: "RFC3339 结束（不含）；缺省 = now；from > to → 400" } }
      responses:
        '200':
          description: 账号 usage items（恒 = account_ids 去重后全量——无记录账号 gateway 全 0，前端免补零；upstream 为 codex 额度快照，api-key 无凭据恒 null）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountsUsageResponse' }
        default:
          $ref: '#/components/responses/Error'
  /accounts/batch-delete:
    post:
      operationId: PostAccountsBatchDelete
      tags: [accounts]
      summary: 批量删除账号（事务，全成或全败）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchDeleteBody' }
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchDeleteResponse' }
        default:
          $ref: '#/components/responses/Error'
  /accounts/batch-update:
    post:
      operationId: PostAccountsBatchUpdate
      tags: [accounts]
      summary: 批量更新账号（fields 为任意字段子集）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchUpdateAccountsBody' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchUpdateResponse' }
        default:
          $ref: '#/components/responses/Error'
  /accounts/batch-reset-cooldown:
    post:
      operationId: PostAccountsBatchResetCooldown
      tags: [accounts]
      summary: 批量重置账号冷却（事务，全成或全败；status→active + cooldown_until=now）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchResetCooldownBody' }
      responses:
        '200':
          description: 重置成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchResetCooldownResponse' }
        default:
          $ref: '#/components/responses/Error'
  /accounts/batch-import-codex-oauth:
    post:
      operationId: PostAccountsBatchImportCodexOauth
      tags: [accounts]
      summary: 批量导入 codex-oauth 凭据（幂等组合键 codex_email + codex_account_id；items ≤100 原始条数；行级失败不毁整批）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodexOAuthImportBody' }
      responses:
        '200':
          description: 导入结果（imported 新建 / updated 键存在更新凭据 / failed 行级 index+error——有失败行也 200）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        default:
          $ref: '#/components/responses/Error'
  /accounts/batch-import-codex-pat:
    post:
      operationId: PostAccountsBatchImportCodexPat
      tags: [accounts]
      summary: 批量导入 codex-pat 凭据（幂等组合键 codex_email + codex_account_id；items ≤100 原始条数；行级失败不毁整批）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodexPATImportBody' }
      responses:
        '200':
          description: 导入结果（imported 新建 / updated 键存在更新凭据 / failed 行级 index+error——有失败行也 200）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        default:
          $ref: '#/components/responses/Error'
  /accounts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: GetAccountsId
      tags: [accounts]
      responses:
        '200':
          description: 账号
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: PutAccountsId
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCreate' }
      responses:
        '200':
          description: 更新后账号
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: DeleteAccountsId
      tags: [accounts]
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedResponse' }
        default:
          $ref: '#/components/responses/Error'
  /accounts/{id}/groups:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: GetAccountsIdGroups
      tags: [accounts]
      summary: 读取账号的全部分组 id（编辑回显；不随账号列表返回）
      responses:
        '200':
          description: 分组 id 列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountGroupsResponse' }
        default:
          $ref: '#/components/responses/Error'
  /accounts/{id}/ext:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: GetAccountsIdExt
      tags: [accounts]
      summary: 读取账号类型化鉴权扩展（编辑回显；仅 codex-oauth/codex-pat 账号有 ext 行）
      responses:
        '200':
          description: 账号 ext 配置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountExt' }
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: PutAccountsIdExt
      tags: [accounts]
      summary: 幂等写入账号类型化鉴权扩展（Create/Update 合一；全列更新含 NULL 清空）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountExt' }
      responses:
        '200':
          description: 写入后的 ext 配置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountExt' }
        default:
          $ref: '#/components/responses/Error'
  /groups:
    post:
      operationId: PostGroups
      tags: [groups]
      summary: 创建分组（平台容量池；key 为独立表，由用户面 /user/keys 创建）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupCreate' }
      responses:
        '200':
          description: 创建后的分组
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: GetGroups
      tags: [groups]
      summary: 分组列表（分页/筛选/排序）
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 200, description: 每页条数（上限 200，超限裁剪到 200） } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: name, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200':
          description: 分组列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupListResponse' }
        default:
          $ref: '#/components/responses/Error'
  /groups/batch-delete:
    post:
      operationId: PostGroupsBatchDelete
      tags: [groups]
      summary: 批量删除分组（事务，全成或全败）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchDeleteBody' }
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchDeleteResponse' }
        default:
          $ref: '#/components/responses/Error'
  /groups/batch-update:
    post:
      operationId: PostGroupsBatchUpdate
      tags: [groups]
      summary: 批量更新分组（fields 为任意字段子集）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchUpdateGroupsBody' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchUpdateResponse' }
        default:
          $ref: '#/components/responses/Error'
  /groups/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: GetGroupsId
      tags: [groups]
      responses:
        '200':
          description: 分组
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: PutGroupsId
      tags: [groups]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupCreate' }
      responses:
        '200':
          description: 更新后分组
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: DeleteGroupsId
      tags: [groups]
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedResponse' }
        default:
          $ref: '#/components/responses/Error'
  /users:
    get:
      operationId: GetUsers
      tags: [users]
      summary: 用户列表（platform_admin 专属；分页/筛选/排序）
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 200, description: 每页条数（上限 200，超限裁剪到 200） } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: email, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserListResponse' }
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: PostUsers
      tags: [users]
      summary: 创建用户（platform_admin 专属；email 唯一/格式、密码 ≤72 字节）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '200':
          description: 创建后的用户（PasswordHash 永不下发）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default:
          $ref: '#/components/responses/Error'
  /users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      operationId: PutUsersId
      tags: [users]
      summary: 更新用户（role/status/max_concurrency/balance；变更即时生效——Auth 快照刷新）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: 更新后的用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default:
          $ref: '#/components/responses/Error'
  /users/{id}/groups:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: GetUsersIdGroups
      tags: [users]
      summary: 读取用户被授予的分组与各专属倍率（platform_admin；用户视角，与 /groups/{id}/assignments 对称）
      responses:
        '200':
          description: 该用户被授予的组 id 列表与各专属倍率
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserGroupsResponse' }
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: PutUsersIdGroups
      tags: [users]
      summary: 设置用户的授予分组（platform_admin；替换语义：未列出即撤销，空数组 = 清空）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserGroupsBody' }
      responses:
        '200':
          description: 已生效的授予组 id 列表与专属倍率
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserGroupsResponse' }
        default:
          $ref: '#/components/responses/Error'
  /temp-balances:
    get:
      operationId: GetTempBalances
      tags: [users]
      summary: 临时额度列表（platform_admin 专属；全量视角含过期/用尽/负扣减行；user_id 筛选；sort 白名单 expires_at/amount/created_at，默认 expires_at asc——FEFO 同序）
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1, description: 页码（1-based） } }
        - { name: page_size, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 1000 } }
        - { name: user_id, in: query, schema: { type: integer, format: int64, description: 按用户筛选；缺省 = 全部用户 } }
        - { name: sort, in: query, schema: { type: string, description: sort 白名单：expires_at/amount/created_at（缺省 expires_at） } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200':
          description: 临时额度列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminTempBalancesResponse' }
        default:
          $ref: '#/components/responses/Error'
  /keys:
    get:
      operationId: GetKeys
      tags: [keys]
      summary: 密钥列表（platform_admin 专属；脱敏，不含 key 明文——密钥明文绝不下发管理端）
      parameters:
        - { name: name, in: query, schema: { type: string, description: 名称模糊搜索（ILIKE '%name%'） } }
        - { name: user_id, in: query, schema: { type: integer, format: int64, description: 按归属用户收窄（keys.user_id 等值）；缺省 = 全部用户 } }
        - { name: group_id, in: query, schema: { type: integer, format: int64, description: 按归属分组收窄（keys.group_id 等值）；缺省 = 全部分组 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 200, description: 每页条数（上限 200，超限裁剪到 200） } }
        - { name: offset, in: query, schema: { type: integer, default: 0, description: 偏移（默认 0） } }
        - { name: sort, in: query, schema: { type: string, description: sort 白名单：id/name/created_at（缺省 id） } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], description: asc/desc（缺省 desc） } }
      responses:
        '200':
          description: 密钥列表（脱敏——响应不含 key 明文）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminKeyListResponse' }
        default:
          $ref: '#/components/responses/Error'
  /groups/{id}/assignments:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: GetGroupsIdAssignments
      tags: [groups]
      summary: 读取组的授予用户与专属倍率（platform_admin；与 PUT 对称，供前端预填充与安全全量写回）
      responses:
        '200':
          description: 该组当前的授予 user_id 列表与专属倍率
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupAssignmentsResponse' }
