      required: [Model, Source, CreatedAt, UpdatedAt]
      properties:
        Model: { type: string, description: 模型/功能标识（litellm search 模型名 或 codex-search 固定标识） }
        PricePerCall: { type: number, format: double, nullable: true, description: "按单元价（USD/次——litellm 原生口径 input_cost_per_query；内部存储毫分/次，×1e5 换算，1 USD = 100,000 毫分，**与 token 价不同换算系**，计费不走 /1e6 除法）；null = 无按单元价" }
        Provider: { allOf: [{ $ref: '#/components/schemas/Provider' }], nullable: true, description: litellm_provider（litellm 行才有；manual 行 nil） }
        Source: { $ref: '#/components/schemas/PricingSource' }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
    FunctionPriceUpsert:
