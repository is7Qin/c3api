    PriceVariantUpsert:
      type: object
      properties:
        service_tier: { type: string, nullable: true }
        ctx_min: { type: integer, format: int64, nullable: true }
        ctx_max: { type: integer, format: int64, nullable: true }
        time_start: { type: string, nullable: true }
        time_end: { type: string, nullable: true }
        dow_mask: { type: integer, nullable: true }
        mult_bp: { type: integer, nullable: true }
        set_input_per_m: { type: number, format: double, nullable: true }
