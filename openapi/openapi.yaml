  # 管理端总览（spec 2026-08-14，用户裁决）：聚合面与实时面拆两个端点——
  # overview（一站式聚合，TTL 30s 缓存）+ users-top（实时并发排行，TTL 2s）。
  # 全冷面（聚合查询 + 门禁快照遍历）；既有端点（GetStats/GetUsageLogs/账号
  # list）保留不动——overview 是聚合便捷面。
  /overview:
    get:
      operationId: GetAdminOverview
      tags: [stats]
      summary: 管理端总览（summary USD + trend 日桶 + 账号健康 + 资源 + err_top + 计费告警）
      description: |
        一站式聚合端点（dashboard 主数据；聚合结果内部 TTL 30s 缓存，键含
        days/group_id 与 UTC 日界——跨午夜滚转）。summary = 今日汇总（UTC 日界，
        cost 毫分 /1e5 → USD，与价格 API 口径一致）；trend = 近 N 天日桶
        （SQL 侧 GROUP BY date_trunc('day', bucket_time)，days 上限 30）；
        accounts = 账号健康分布 + 并发水位（调度器快照同源）；err_top = 账号
        维度 err_rate Top5（调度器 EWMA，name = 账号名）；alerts = billing
        flusher 水线状态（注入面读取）。
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 30, default: 7, description: 趋势天数（含今日；缺省 7，上限 30） } }
        - { name: group_id, in: query, schema: { type: integer, format: int64, description: 按组过滤聚合（summary/trend；缺省全局） } }
      responses:
        '200':
          description: 总览聚合（summary/trend/accounts/resources/err_top/alerts）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OverviewResponse' }
        default:
          $ref: '#/components/responses/Error'
  /users-top:
    get:
      operationId: GetAdminUsersTop
      tags: [stats]
      summary: 实时在途并发排行 TopN（本实例视角）
      description: |
        实时并发排行：读门禁快照在途计数（Auth.InFlightUsers 只读访问器——
        零锁零热路径），过滤 0 → 降序 → TopN + other 归并（其余在途用户合计，
        非伪用户条目）；email = TopN user_id 一次 IN 查询回填。内部 TTL 2s 缓存
        （top 并入缓存键）。多实例部署下为**本实例**在途并发（各实例独立计数）。
      parameters:
        - { name: top, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20, description: 排行条数（缺省 20，上限 100） } }
      responses:
        '200':
          description: 实时在途并发 TopN + other 归并
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsersTopResponse' }
        default:
          $ref: '#/components/responses/Error'
  # 运维观测面（/admin/ops/workers，用户裁决并入管理面）：路由由 oapi-codegen
  # chi-server 生成（BaseURL /api/admin 拼接），鉴权走 /api/admin 组 adminAuth；类型在
  # 契约（handler/api.gen.go + 前端 schema.d.ts 同源）。
  /ops/workers:
    get:
      operationId: GetOpsWorkers
      tags: [ops]
      summary: 运维观测（worker 状态 + 快照注册表）
      responses:
        '200':
          description: 运维观测快照（各 worker 原子读计数器；stats 异构）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkersResponse' }
        default:
          $ref: '#/components/responses/Error'
components:
  responses:
    Error:
      description: 错误响应
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
    DeletedResponse:
      type: object
      required: [deleted]
      properties:
        deleted: { type: boolean }
    RequestFormat:
      type: string
      enum: [openai-chat, openai-responses, openai-responses-ws, openai-images, openai-search, anthropic]
    AccountStatus:
      type: string
      enum: [active, unhealthy, "429", disabled]
    ErrorType:
      type: string
      enum: [none, "429", "4xx", "5xx", network, auth, no_account, abort, billing]
    TemplateCreate:
      type: object
      required: [name, supported_formats]
      properties:
        name: { type: string }
        # base_url 全类型可选（2026-08-14 用户裁决）；提供时须为裸根（不含 /v1，
        # service 校验）。空：codex 类型走 SDK 默认端点；api_key 静态透传留空
        # 则路由时失败（管理面不拦截）。
        base_url: { type: string }
        # credential_type 模板级：一个模板 = 一种号池；缺省 = api_key。
        # 生态三类型（responses-special/codex-oauth/codex-pat）只支持 resp / resp-ws /
        # openai-images / openai-search 格式（service 校验）；类型化配置走 /templates/{id}/ext。
        credential_type: { type: string, enum: [api_key, responses-special, codex-oauth, codex-pat], default: api_key }
        supported_formats:
          type: array
          minItems: 1
          items: { type: string, enum: [openai-chat, openai-responses, openai-responses-ws, openai-images, openai-search, anthropic] }
        models:
          type: array
          items: { type: string }
        format_models:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        model_mapping:
          type: object
          additionalProperties: { type: string }
    Template:
      type: object
      required: [ID, Name, BaseURL, SupportedFormats, CreatedAt, UpdatedAt]
      properties:
        ID: { type: integer, format: int64 }
        Name: { type: string }
        BaseURL: { type: string }
        CredentialType: { type: string, enum: [api_key, responses-special, codex-oauth, codex-pat], description: 模板号池类型；生态三类型只支持 resp / resp-ws 格式 }
        SupportedFormats:
          type: array
          items: { type: string, enum: [openai-chat, openai-responses, openai-responses-ws, openai-images, openai-search, anthropic] }
        Models:
          type: array
          items: { type: string }
        FormatModels:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        ModelMapping:
          type: object
          additionalProperties: { type: string }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
        DeletedAt: { type: string, format: date-time, nullable: true, description: 软删除时间戳；null = 存活（列表过滤已删；GET 单个可查已删项） }
    AccountCreate:
      type: object
      required: [name, template_id, upstream_key]
      properties:
        name: { type: string }
        template_id: { type: integer, format: int64 }
        # 账号级 base_url 覆盖（路由属性，位于 upstream_key 前——用户裁决
        # 2026-08-14）：非空 = 覆盖模板 base_url；""/null/缺省统一 = 继承模板
        # （create 路径空串归一 nil，与批量三态语义分写）。
        base_url: { type: string, nullable: true, description: "账号级覆盖（可选）：非空优先于模板 base_url；null = 继承模板" }
        # upstream_key：api_key/responses-special 模板必填（静态透传上游 key）；
        # codex-oauth/codex-pat 模板可选（凭据走 account_ext——创建后经
        # /accounts/{id}/ext 配置；service 按模板类型校验）。
        upstream_key: { type: string }
        status: { $ref: '#/components/schemas/AccountStatus' }
        weight: { type: integer }
        max_concurrency: { type: integer }
        # 创建时可选：null/缺省 = 无分组；提供 = 替换语义（空数组 = 无分组）
        group_ids:
          type: array
          items: { type: integer, format: int64 }
    Account:
      type: object
      properties:
        ID: { type: integer, format: int64 }
        Name: { type: string }
        TemplateID: { type: integer, format: int64 }
        Template: { $ref: '#/components/schemas/Template' }
        # 账号级 base_url 覆盖（路由属性，位于 upstream_key 前）：null = 继承模板
        BaseURL: { type: string, nullable: true, description: "账号级覆盖：非空优先于模板 base_url；null = 继承模板" }
        UpstreamKey: { type: string }
        Status: { $ref: '#/components/schemas/AccountStatus' }
        CooldownUntil: { type: string, format: date-time, nullable: true }
        Weight: { type: integer }
        MaxConcurrency: { type: integer }
        LastError: { type: string, nullable: true }
        LastUsedAt: { type: string, format: date-time, nullable: true }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
        DeletedAt: { type: string, format: date-time, nullable: true, description: 软删除时间戳；null = 存活（列表过滤已删；GET 单个可查已删项） }
    AccountView:
      allOf:
        - $ref: '#/components/schemas/Account'
        - type: object
          properties:
            concurrency: { type: integer, format: int64 }
            err_rate: { type: number, format: double }
            err_count: { type: integer }
    CodexUsageSnapshot:
      type: object
      description: 账号 codex 额度快照（sdkbridge；每块可选——上游没返回就不出字段；金额为字符串不解析保精度）
      properties:
        plan_type: { type: string }
        rate_limit: { $ref: '#/components/schemas/CodexRateLimit' }
        credits: { $ref: '#/components/schemas/CodexCredits' }
        spend_control: { $ref: '#/components/schemas/CodexSpendControl' }
    CodexRateLimit:
      type: object
      required: [used_percent]
      description: 主窗口用量（reset_at RFC3339——上游主窗口省略时 null，非虚假 0001-01-01）
      properties:
        used_percent: { type: integer }
        reset_at: { type: string, format: date-time, nullable: true }
    CodexCredits:
      type: object
      required: [balance]
      description: 充值余额（金额字符串，如 "12.50"；上游空串 → null，非空串占位）
      properties:
        balance: { type: string, nullable: true }
    CodexSpendControl:
      type: object
      required: [limit, used, remaining, used_percent, remaining_percent]
      description: 消费控制额度（金额字符串）
      properties:
        limit: { type: string }
        used: { type: string }
        remaining: { type: string }
        used_percent: { type: integer }
        remaining_percent: { type: integer }
    UsageGatewayStats:
      type: object
      required: [raw_cost_usd, cost_usd, requests, total_tokens]
      description: 账号网关计费聚合（usage_logs 实时明细；毫分 /1e5 → USD；无记录账号全 0）
      properties:
        raw_cost_usd: { type: number, format: double, description: 乘倍率前原始成本（USD，毫分 /1e5） }
        cost_usd: { type: number, format: double, description: 计费成本（USD，毫分 /1e5） }
        requests: { type: integer, format: int64, description: 请求数（COUNT(*)） }
        total_tokens: { type: integer, format: int64, description: 总 token（SUM(total_tokens)） }
    AccountUsageItem:
      type: object
      required: [account_id, gateway]
      description: 账号 usage 视图 item（恒 = account_ids 去重后全量；upstream 为 codex 额度快照，api-key/无凭据账号恒 null）
      properties:
        account_id: { type: integer, format: int64 }
        gateway: { $ref: '#/components/schemas/UsageGatewayStats' }
        upstream:
          allOf:
            - $ref: '#/components/schemas/CodexUsageSnapshot'
          nullable: true
        upstream_error:
          type: string
          nullable: true
          enum: [auth_expired, upstream_unavailable]
          description: 上游快照失败分类（null = 无上游能力/快照成功；auth_expired = 凭据失效（fatal 类）；upstream_unavailable = 网络/5xx 等上游错误）
    AccountsUsageResponse:
      type: object
      required: [items]
      description: 账号用量聚合响应（items 顺序 = account_ids 去重后顺序）
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AccountUsageItem' }
    TemplateExt:
      type: object
      required: [credential_type]
      properties:
        # template_id 只读（响应）；请求体忽略——路径 {id} 为准。
        template_id: { type: integer, format: int64 }
        credential_type: { type: string, enum: [responses-special, codex-oauth, codex-pat], description: "类型声明；必须与父模板 credential_type 一致（不一致 → 400）" }
        # 模板是共享配置面：唯一可配置列 strip_image_tools（三类型公共能力开关）——
        # 凭据列组（oauth/pat）一律在账号级 account_ext（账号私有）。
        strip_image_tools: { type: boolean, nullable: true, description: "三类型公共能力开关：模板级图像 tool 剥离（NULL = 未配置 = 关闭）" }
    AccountExt:
      type: object
      required: [credential_type]
      properties:
        # account_id 只读（响应）；请求体忽略——路径 {id} 为准。
        account_id: { type: integer, format: int64 }
        credential_type: { type: string, enum: [codex-oauth, codex-pat], description: "类型-列组约束（service 校验）：oauth 只允许 codex_oauth_* 列组；pat 只允许 codex_pat_key" }
        # 身份四元组对象（与存储 codex_identity jsonb 同形——映射层零展开/收拢；
        # 首次写入缺省 → service 自动生成（UUIDv4/v7 形状）并持久化，账号存在
        # 期间稳定；显式提供 → 采用；恒等 thread_id == session_id、window_id =
        # {thread_id}:0。请求语义：null 与空串同 = 未提供——沿用存量/自动生成
        # （identity 无清空路径）。响应语义：nil 身份 → 字段省略（不输出 null）。
        codex_identity: { $ref: '#/components/schemas/CodexIdentity' }
        # 凭据列组（按 credential_type 约束）。请求语义：null/缺省 = NULL 清空
        # 落库；空串 = 字面空值写入（两者区分）。响应语义：nil → null。
        codex_oauth_token: { type: string, nullable: true, description: "凭据：oauth 访问令牌（oauth 行必填——最小完整性）" }
        codex_oauth_refresh_token: { type: string, nullable: true, description: "凭据：oauth 刷新令牌" }
        codex_oauth_expires_at: { type: string, format: date-time, nullable: true, description: "凭据：oauth 访问令牌过期时间" }
        codex_pat_key: { type: string, nullable: true, description: "凭据：pat" }
        # 管理标识（非请求面）
        codex_email: { type: string, nullable: true, description: "管理标识：codex 账号登录邮箱（导入时由人工/上游提供，非自动生成——NewCodexIdentity 只生成身份四元组；可空）" }
        # 上游账号/空间标识（Task B 批量导入必填；本 task 仅 schema 声明——写入面 Task B）
        codex_account_id: { type: string, nullable: true, description: "上游账号/空间标识（Task B 导入必填；本 task 仅声明）" }
    CodexIdentity:
      type: object
      description: "codex 账号身份四元组（account_ext.codex_identity jsonb 契约形态；对象字段请求语义：null 与空串同 = 未提供）"
      properties:
        installation_id: { type: string, description: "身份：账号级唯一（UUIDv4；响应恒有——首次写入自动生成；空/缺省 → service 自动生成）" }
        session_id: { type: string, nullable: true, description: "身份：会话级（UUIDv7；恒等 == thread_id；service 自动生成/沿用；响应 nil → null）" }
        thread_id: { type: string, nullable: true, description: "身份：会话级（UUIDv7；恒等 == session_id；响应 nil → null）" }
        window_id: { type: string, nullable: true, description: "身份：会话级派生 {thread_id}:0（导入时生成后恒定不变——恒 0，无透传无解析；上游不校验 n；响应 nil → null）" }
    CodexOAuthImportItem:
      type: object
      required: [codex_email, codex_account_id, codex_oauth_token, codex_oauth_refresh_token]
      description: 批量导入 codex-oauth 单行（组合幂等键 codex_email + codex_account_id；token+refresh 成对必填）
      properties:
        codex_email: { type: string, description: "组合幂等键①：codex 账号登录邮箱（必填；格式非法 → 行级 failed）" }
        codex_account_id: { type: string, description: "组合幂等键②：上游账号/空间标识（必填）" }
        codex_oauth_token: { type: string, description: "凭据：oauth 访问令牌（必填；与 refresh 成对）" }
        codex_oauth_refresh_token: { type: string, description: "凭据：oauth 刷新令牌（必填；与 token 成对）" }
        # 原始字符串（非 format: date-time）——解析失败须行级 failed（行级错误
        # 归 failed 不整批 400）；nil = 过期未知 → 401 自愈。
        codex_oauth_expires_at: { type: string, description: "凭据：oauth 访问令牌过期时间（可选；RFC3339 格式——解析失败 → 行级 failed）" }
        max_concurrency: { type: integer, description: "可选；缺省 25（导入面裁决——非账号表默认 8）；<1 → 归 25" }
        weight: { type: integer, description: "可选；缺省 100；负值 → 行级 failed" }
    CodexPATImportItem:
      type: object
      required: [codex_email, codex_account_id, codex_pat_key]
      description: 批量导入 codex-pat 单行（组合幂等键同上）
      properties:
        codex_email: { type: string, description: "组合幂等键①：codex 账号登录邮箱（必填；格式非法 → 行级 failed）" }
        codex_account_id: { type: string, description: "组合幂等键②：上游账号/空间标识（必填）" }
        codex_pat_key: { type: string, description: "凭据：pat（必填非空）" }
        max_concurrency: { type: integer, description: "可选；缺省 25（导入面裁决）；<1 → 归 25" }
        weight: { type: integer, description: "可选；缺省 100；负值 → 行级 failed" }
    CodexOAuthImportBody:
      type: object
      required: [items, template_id]
      description: 批量导入 codex-oauth 请求体（items 1-100 原始条数——空/超限 → 400；template_id 必填——缺失 → 400 / 不存在 → 404；**credential_type 必须 == codex-oauth——错配 → 400 整批拒绝**；group_id 可选——不存在 → 行级 failed）
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/CodexOAuthImportItem' }
        template_id: { type: integer, format: int64, description: "必填：codex 账号归属模板（credential_type 必须 == 端点类型 codex-oauth）" }
        group_id: { type: integer, format: int64, nullable: true, description: "可选：新建账号归组（缺省不归组；不存在 → 行级 failed——FK 违反归行级不整批 400）" }
    CodexPATImportBody:
      type: object
      required: [items, template_id]
      description: 批量导入 codex-pat 请求体（items 1-100 原始条数——空/超限 → 400；template_id 必填——缺失 → 400 / 不存在 → 404；**credential_type 必须 == codex-pat——错配 → 400 整批拒绝**；group_id 可选——不存在 → 行级 failed）
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/CodexPATImportItem' }
        template_id: { type: integer, format: int64, description: "必填：codex 账号归属模板（credential_type 必须 == 端点类型 codex-pat）" }
        group_id: { type: integer, format: int64, nullable: true, description: "可选：新建账号归组（不存在 → 行级 failed）" }
    ImportFailedItem:
      type: object
      required: [index, error]
      description: 行级失败条目（index = items 原始下标——行级定位契约）
      properties:
        index: { type: integer, description: "items 原始下标" }
        error: { type: string, description: "该行失败原因文案" }
    ImportResult:
      type: object
      required: [imported, updated, failed]
      description: 批量导入结果（单行失败不毁整批——整批不原子；有失败行也 200）
      properties:
        imported: { type: integer, description: "新建账号数" }
        updated: { type: integer, description: "键存在更新凭据数" }
        failed:
          type: array
          items: { $ref: '#/components/schemas/ImportFailedItem' }
    TemplateListResponse:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/Template' }
    AccountListResponse:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/AccountView' }
    GroupListResponse:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/Group' }
    GroupVisibility:
      type: string
      enum: [public, private]
    GroupProtocolConvert:
      type: string
      enum: [chat_to_resp, mess_to_resp, resp_to_mess, chat_to_mess]
      description: 分组级协议转换方向（只补差，W5 网关 internal/protoconv 消费）：chat_to_resp = 客户端 chat → 模板 resp；mess_to_resp = anthropic messages → resp；resp_to_mess = resp → anthropic messages；chat_to_mess = chat → anthropic messages。off 不在枚举内——不转换 = 空数组（见 protocol_convert 字段说明）
    GroupAssignmentsBody:
      type: object
      required: [user_ids]
      properties:
        user_ids:
          type: array
          items: { type: integer, format: int64 }
          description: 替换语义：完整授予列表（未列出即撤销；空数组 = 清空）
        multipliers:
          type: object
          additionalProperties:
            type: number
            format: double
            nullable: true
            minimum: 0
            maximum: 10
          description: 可选：user_id → 该用户在该组的专属价格倍率（正常值，1 = ×1，0 = 免费，上限 10 = ×10；API 边界与万分数换算）。仅对 user_ids 中列出的用户生效；null = 清除为未设置（回退组倍率）；未列出的用户沿用当前值
    GroupAssignmentsResponse:
      type: object
      required: [user_ids]
      properties:
        user_ids:
          type: array
          items: { type: integer, format: int64 }
        multipliers:
          type: object
          additionalProperties:
            type: number
            format: double
            nullable: true
          description: 该组当前各用户的专属价格倍率（正常值；null/缺省 = 未设置 → 用组倍率）
    UserGroupsBody:
      type: object
      required: [group_ids]
      properties:
        group_ids:
          type: array
          items: { type: integer, format: int64 }
          description: 替换语义：完整授予组列表（未列出即撤销；空数组 = 清空）
        multipliers:
          type: object
          additionalProperties:
            type: number
            format: double
            nullable: true
            minimum: 0
            maximum: 10
          description: 可选：group_id → 该用户在该组的专属价格倍率（正常值，1 = ×1，0 = 免费，上限 10 = ×10；API 边界与万分数换算）。仅对 group_ids 中列出的组生效；null = 清除为未设置（回退组倍率）；未列出的组沿用当前值
    UserGroupsResponse:
      type: object
      required: [group_ids]
      properties:
        group_ids:
          type: array
          items: { type: integer, format: int64 }
        multipliers:
          type: object
          additionalProperties:
            type: number
            format: double
            nullable: true
          description: 该用户当前各授予组的专属价格倍率（正常值；null/缺省 = 未设置 → 用组倍率）
    KeyStatus:
      type: string
      enum: [active, disabled]
    Key:
      type: object
      properties:
        ID: { type: integer, format: int64 }
        UserID: { type: integer, format: int64 }
