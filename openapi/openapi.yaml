          items: { $ref: '#/components/schemas/SnapshotState' }
        generated_at: { type: string, format: date-time }
    # 管理端总览（spec 2026-08-14）：OverviewResponse 各段类型。
    OverviewSummary:
      type: object
      required: [requests, errors, err_rate, cost_usd, raw_cost_usd, input_tokens, output_tokens, total_tokens, cache_read_tokens, call_count, ttft_avg_ms, ttft_max_ms, ttft_p50_ms, ttft_p90_ms, ttft_p95_ms, ttft_p99_ms]
      description: 今日汇总（UTC 日界；cost_usd/raw_cost_usd = 毫分 /1e5 → USD；TTFT 指标仅含首 token 流式请求样本，无样本 = 0）
      properties:
        requests: { type: integer, format: int64 }
        errors: { type: integer, format: int64 }
        err_rate: { type: number, format: double, description: 错误率（errors / requests；无请求 = 0） }
        cost_usd: { type: number, format: double, description: 今日成本（USD，毫分 /1e5——与价格 API 口径一致） }
        raw_cost_usd: { type: number, format: double, description: 今日原始成本（USD，毫分 /1e5——乘倍率前"实际消耗"口径；免费组 cost 为 0 但 raw 有值） }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        total_tokens: { type: integer, format: int64 }
        cache_read_tokens: { type: integer, format: int64 }
        call_count: { type: integer, format: int64, description: 按次调用（图片生成 = 张数、search = 1；usage_logs call_count 离线聚合 sum） }
        ttft_avg_ms: { type: number, format: double, description: TTFT 均值（ttft_total_ms / ttft_count，查询侧 Go 除） }
        ttft_max_ms: { type: integer, format: int64, description: TTFT 最大值 }
        ttft_p50_ms: { type: integer, format: int64, description: TTFT p50（直方图桶内线性插值，nearest-rank；顶桶回落 12800） }
        ttft_p90_ms: { type: integer, format: int64 }
        ttft_p95_ms: { type: integer, format: int64 }
        ttft_p99_ms: { type: integer, format: int64 }
    OverviewTrend:
      type: object
      required: [date, requests, errors, cost_usd, raw_cost_usd, tokens, call_count, ttft_avg_ms, ttft_max_ms, ttft_p50_ms, ttft_p90_ms, ttft_p95_ms, ttft_p99_ms]
      description: 近 N 天日桶（SQL 侧 GROUP BY date_trunc('day', bucket_time)；UTC 日；TTFT 指标仅含首 token 流式请求样本，无样本 = 0）
      properties:
        date: { type: string, format: date, description: 日桶（UTC） }
        requests: { type: integer, format: int64 }
        errors: { type: integer, format: int64 }
        cost_usd: { type: number, format: double, description: 当日成本（USD，毫分 /1e5） }
        raw_cost_usd: { type: number, format: double, description: 当日原始成本（USD，毫分 /1e5——乘倍率前"实际消耗"口径） }
        tokens: { type: integer, format: int64, description: 当日总 token（usage_stats total_tokens 列聚合） }
        call_count: { type: integer, format: int64, description: 按次调用（图片生成 = 张数、search = 1） }
        ttft_avg_ms: { type: number, format: double, description: 当日 TTFT 均值（查询侧 Go 除） }
        ttft_max_ms: { type: integer, format: int64 }
        ttft_p50_ms: { type: integer, format: int64 }
        ttft_p90_ms: { type: integer, format: int64 }
        ttft_p95_ms: { type: integer, format: int64 }
        ttft_p99_ms: { type: integer, format: int64 }
    OverviewAccounts:
      type: object
      required: [active, unhealthy, "429", disabled, concurrency, max_concurrency]
      description: 账号健康分布 + 并发水位（调度器快照同源——与账号列表运行时视图一致）
      properties:
        active: { type: integer }
        unhealthy: { type: integer }
        "429": { type: integer }
        disabled: { type: integer }
        concurrency: { type: integer, format: int64, description: 在途并发合计 }
        max_concurrency: { type: integer, description: 并发上限合计（水位 = concurrency / max_concurrency） }
    OverviewResources:
      type: object
      required: [templates, groups, users]
      description: 资源计数（冷面 count；模板/分组排除软删）
      properties:
        templates: { type: integer }
        groups: { type: integer }
        users: { type: integer }
    OverviewErrTop:
      type: object
      required: [name, err_rate, err_count]
      description: 账号维度错误率 Top5（调度器 EWMA err_rate 降序；name = 账号名）
      properties:
        name: { type: string, description: 账号名（非模型名——账号维度） }
        err_rate: { type: number, format: double }
        err_count: { type: integer }
    OverviewAlerts:
      type: object
      required: [billing_pending, billing_pending_waterline, billing_warned]
      description: 告警面（billing flusher 水线状态；注入面读取，未装配 = 全零）
      properties:
        billing_pending: { type: integer, format: int64, description: 尚未落库的计费日志条数 }
        billing_pending_waterline: { type: integer, format: int64, description: 水线（包级常量直读） }
        billing_warned: { type: boolean, description: 水线告警边沿是否置位 }
    OverviewResponse:
      type: object
      required: [summary, trend, accounts, resources, err_top, alerts]
      properties:
        summary: { $ref: '#/components/schemas/OverviewSummary' }
        trend:
          type: array
          items: { $ref: '#/components/schemas/OverviewTrend' }
        accounts: { $ref: '#/components/schemas/OverviewAccounts' }
        resources: { $ref: '#/components/schemas/OverviewResources' }
        err_top:
          type: array
          items: { $ref: '#/components/schemas/OverviewErrTop' }
        alerts: { $ref: '#/components/schemas/OverviewAlerts' }
    UsersTopEntry:
      type: object
      required: [user_id, email, concurrency]
      description: 实时在途并发条目（users 表无 name 列——仅 email）
      properties:
        user_id: { type: integer, format: int64 }
        email: { type: string, description: 邮箱（TopN user_id 一次 IN 查询回填；缺失 = 空串） }
        concurrency: { type: integer, format: int64, description: 在途请求数 }
    UsersTopResponse:
      type: object
      required: [users, other_concurrency]
      description: 实时并发排行（本实例视角；TopN + other 归并）
      properties:
        users:
          type: array
          items: { $ref: '#/components/schemas/UsersTopEntry' }
        other_concurrency: { type: integer, format: int64, description: 其余在途用户合计（TopN 之外；非伪用户条目） }
