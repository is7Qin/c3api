  # --- 兑换码（tag: redemptions；Phase 5 计费前基础设施——资源发放的通用载体） ---
  # 注意 chi 路径顺序：/redemption-codes/batch-deactivate 必须先于
  # /redemption-codes/{id}/... 注册（生成器按 spec 顺序注册，防 "batch-deactivate"
  # 被 {id} 捕获，对齐 /templates/batch-delete 先例）。
  /redemption-codes:
    post:
      operationId: PostRedemptionCodes
      tags: [redemptions]
      summary: 生成兑换码（1..count 个；count 默认 1，上限 1000；type 枚举/value>0/temp_balance 必填 resource_expires_at）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateRequest' }
      responses:
        '200':
          description: 生成的完整码列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerateResponse' }
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: GetRedemptionCodes
      tags: [redemptions]
      summary: 兑换码列表（增强分页范式 page/page_size；type/status 筛选；sort 白名单）
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1, description: 页码（1-based） } }
        - { name: page_size, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 1000 } }
        - { name: type, in: query, schema: { type: string, enum: [balance, concurrency, temp_balance] } }
        - { name: status, in: query, schema: { type: string, enum: [active, disabled] } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200':
          description: 兑换码列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedemptionCodeListResponse' }
        default:
          $ref: '#/components/responses/Error'
  /redemption-codes/batch-deactivate:
    post:
      operationId: PostRedemptionCodesBatchDeactivate
      tags: [redemptions]
      summary: 批量失效兑换码（单事务；已失效 no-op；缺失 id → 404 含缺失详情）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchDeactivateRequest' }
      responses:
        '200':
          description: 新失效数（已 disabled 不计）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchDeactivateResponse' }
        default:
          $ref: '#/components/responses/Error'
  /redemption-codes/{id}/uses:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: GetRedemptionCodesIdUses
      tags: [redemptions]
      summary: 某码的兑换记录（审计；码缺失 → 404）
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: 兑换记录列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedemptionUseListResponse' }
        default:
          $ref: '#/components/responses/Error'
  /redemption-codes/{id}/deactivate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: PostRedemptionCodesIdDeactivate
      tags: [redemptions]
      summary: 单码失效（已失效 no-op；缺失 → 404）
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeactivateRequest' }
      responses:
        '200':
          description: 失效成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeactivateResponse' }
        default:
          $ref: '#/components/responses/Error'
  # --- litellm 模型价格（tag: pricing；Phase 5 计费价格来源） ---
  # 模型标识在 query（PUT/DELETE 的 model 参数）：模型名是自由字符串可含 `/`
  # （如 1024-x-1024/50-steps/bedrock/amazon.nova-canvas-v1:0），路径参数单段
  # 匹配会拆段 404——URL 编码与 chi 通配方案均否决，见 spec 裁决（2026-08-14）。
  /pricing:
    get:
      operationId: GetPricing
      tags: [pricing]
      summary: 模型价格列表（分页/筛选/排序；sort 白名单 model/updated_at）
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1, description: 页码（1-based） } }
        - { name: page_size, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 1000 } }
        - { name: source, in: query, schema: { type: string, enum: [litellm, manual] } }
        - { name: provider, in: query, schema: { $ref: '#/components/schemas/Provider', description: 厂商等值筛选（DB 侧自由字符串，不限于枚举；缺省 = 不筛） } }
        - { name: model, in: query, schema: { type: string, description: 模型名模糊搜索（大小写不敏感） } }
        - { name: sort, in: query, schema: { type: string, description: sort 白名单：model/updated_at } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200':
          description: 价格列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricingListResponse' }
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: PutPricingModel
      tags: [pricing]
      summary: 手动设价（毫分/1M tokens；upsert 强制 source=manual，可接管 litellm 行）
      parameters:
        - { name: model, in: query, required: true, schema: { type: string, description: 模型名 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PricingUpsert' }
      responses:
        '200':
          description: 设价后的价格行
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pricing' }
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: DeletePricingModel
      tags: [pricing]
      summary: 删除手动价（litellm 行 → 409；不存在 → 404；删除后下轮拉取补回）
      parameters:
        - { name: model, in: query, required: true, schema: { type: string, description: 模型名 } }
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedResponse' }
        default:
          $ref: '#/components/responses/Error'
  /pricing/sync:
    post:
      operationId: PostPricingSync
      tags: [pricing]
      summary: 手动触发一次价格同步（fetch 官方价格表 → upsert → 快照重载；失败保留旧价）
      responses:
        '200':
          description: 拉取统计
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricingSyncResponse' }
        default:
          $ref: '#/components/responses/Error'
  /pricing/sync/preview:
    post:
      operationId: PostPricingSyncPreview
      tags: [pricing]
      summary: 预览价格同步（零写库 diff 报告）
      responses:
        '200':
          description: 预览报告
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricingSyncPreviewResponse' }
        default:
          $ref: '#/components/responses/Error'
  /prices:
    get:
      operationId: GetPrices
      tags: [pricing]
      summary: 统一价格列表（分页+筛选）
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 1000 } }
        - { name: mode, in: query, schema: { type: string, enum: [token, call, image] } }
        - { name: source, in: query, schema: { type: string, enum: [litellm, manual] } }
        - { name: model, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200':
          description: 价格列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceEntryListResponse' }
        default:
          $ref: '#/components/responses/Error'
  /prices/{model}:
    parameters:
      - { name: model, in: path, required: true, schema: { type: string } }
    get:
      operationId: GetPricesModel
      tags: [pricing]
      responses:
        '200':
          description: 价格条目
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceEntry' }
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: PutPricesModel
      tags: [pricing]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriceEntryUpsert' }
      responses:
        '200':
          description: 更新后条目
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceEntry' }
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: DeletePricesModel
      tags: [pricing]
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedResponse' }
        default:
          $ref: '#/components/responses/Error'
  /prices/{model}/variants:
    parameters:
      - { name: model, in: path, required: true, schema: { type: string } }
    get:
      operationId: GetPricesModelVariants
      tags: [pricing]
      responses:
        '200':
          description: 变体列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceVariantListResponse' }
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: PutPricesModelVariants
      tags: [pricing]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriceVariantListRequest' }
      responses:
        '200':
          description: 更新后变体列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceVariantListResponse' }
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: DeletePricesModelVariants
      tags: [pricing]
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedResponse' }
        default:
          $ref: '#/components/responses/Error'
  # --- 图片生成价格（tag: pricing；Task A 数据面——images 端点计费价格来源） ---
  # 模型标识在 query（PUT/DELETE 的 model 参数，同 /pricing——模型名可含 `/`）。
  /image-price:
    get:
      operationId: GetImagePrice
      tags: [pricing]
      summary: 图片生成价格列表（分页/筛选/排序；sort 白名单 model/updated_at）
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1, description: 页码（1-based） } }
        - { name: page_size, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 1000 } }
        - { name: source, in: query, schema: { type: string, enum: [litellm, manual] } }
        - { name: provider, in: query, schema: { $ref: '#/components/schemas/Provider', description: 厂商等值筛选（DB 侧自由字符串，不限于枚举；缺省 = 不筛） } }
        - { name: model, in: query, schema: { type: string, description: 模型名模糊搜索（大小写不敏感） } }
        - { name: sort, in: query, schema: { type: string, description: sort 白名单：model/updated_at } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200':
          description: 图片价格列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImagePriceListResponse' }
        default:
          $ref: '#/components/responses/Error'
    put:
      parameters:
        - { name: model, in: query, required: true, schema: { type: string, description: 模型名 } }
      operationId: PutImagePriceModel
      tags: [pricing]
      summary: 手动设图片价格（三分量全可选；至少一个非 null——否则 400；upsert 强制 source=manual，可接管 litellm 行）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImagePriceUpsert' }
      responses:
        '200':
          description: 设价后的图片价格行
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImagePrice' }
        default:
          $ref: '#/components/responses/Error'
    delete:
      parameters:
        - { name: model, in: query, required: true, schema: { type: string, description: 模型名 } }
      operationId: DeleteImagePriceModel
      tags: [pricing]
      summary: 删除手动图片价格（litellm 行 → 409；不存在 → 404；删除后下轮拉取补回）
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedResponse' }
        default:
          $ref: '#/components/responses/Error'
  # --- 按单元计费功能类价格（tag: pricing；价格表三件套——search 起，audio/video
  # 等未来 per-unit 端点复用；对齐 image_price 形态） ---
  # 模型标识在 query（PUT/DELETE 的 model 参数，同 /pricing——模型名可含 `/`）。
  /function-prices:
    get:
      operationId: GetFunctionPrices
      tags: [pricing]
      summary: 按单元计费功能类价格列表（分页/筛选/排序；sort 白名单 model/updated_at）
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1, description: 页码（1-based） } }
        - { name: page_size, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 1000 } }
        - { name: source, in: query, schema: { type: string, enum: [litellm, manual] } }
        - { name: provider, in: query, schema: { $ref: '#/components/schemas/Provider', description: 厂商等值筛选（DB 侧自由字符串，不限于枚举；缺省 = 不筛） } }
        - { name: model, in: query, schema: { type: string, description: 模型/功能标识模糊搜索（大小写不敏感；含 codex-search） } }
        - { name: sort, in: query, schema: { type: string, description: sort 白名单：model/updated_at } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200':
          description: 按单元价列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FunctionPriceListResponse' }
        default:
          $ref: '#/components/responses/Error'
    put:
      parameters:
        - { name: model, in: query, required: true, schema: { type: string, description: 模型/功能标识（如 codex-search） } }
      operationId: PutFunctionPricesModel
      tags: [pricing]
      summary: 手动设按单元价（price_per_call USD/次 必填 ≥0；×1e5 存储毫分/次；upsert 强制 source=manual，可接管 litellm 行——codex-search 价可改）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FunctionPriceUpsert' }
      responses:
        '200':
          description: 设价后的按单元价行
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FunctionPrice' }
        default:
          $ref: '#/components/responses/Error'
    delete:
      parameters:
        - { name: model, in: query, required: true, schema: { type: string, description: 模型/功能标识（如 codex-search） } }
      operationId: DeleteFunctionPricesModel
      tags: [pricing]
      summary: 删除手动按单元价（litellm 行 → 409；不存在 → 404；删除后下轮拉取补回；codex-search 种子行重启补回）
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedResponse' }
        default:
          $ref: '#/components/responses/Error'
  # --- /user 面（tag: user；生成到 internal/handler/user 独立 ServerInterface） ---
  /api/user/auth/register:
    post:
      operationId: PostUserAuthRegister
      tags: [user]
      summary: 注册（signup_enabled 开关检查；注册即登录返回 JWT）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserAuthRegister' }
      responses:
        '200':
          description: JWT + 用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAuthResponse' }
        default:
          $ref: '#/components/responses/Error'
  /api/user/auth/login:
    post:
      operationId: PostUserAuthLogin
      tags: [user]
      summary: 登录（bcrypt 校验 → JWT）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserAuthLogin' }
      responses:
        '200':
          description: JWT + 用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAuthResponse' }
        default:
          $ref: '#/components/responses/Error'
  /api/user/auth/me:
    get:
      operationId: GetUserAuthMe
      tags: [user]
      summary: 当前用户信息（JWT）
      responses:
        '200':
          description: 用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default:
          $ref: '#/components/responses/Error'
  /api/user/auth/change-password:
    post:
      operationId: PostUserAuthChangePassword
      tags: [user]
      summary: 修改密码（旧密码校验复用登录语义——失败 401 同登录文案防枚举；新密码非空且 ≤72 字节，非法 400；不撤销既有 JWT，新密码下次登录生效）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserAuthChangePassword' }
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangePasswordResponse' }
        default:
          $ref: '#/components/responses/Error'
  /api/user/auth/register-code:
    post:
      operationId: PostUserAuthRegisterCode
      tags: [user]
      summary: 发送注册验证码（signup_enabled  gate 403；已注册静默抑制仍 200；限频 429）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterCodeRequest' }
      responses:
        '200':
          description: 已发送（恒 {sent:true}）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SentResponse' }
        default:
          $ref: '#/components/responses/Error'
  /api/user/auth/forgot-password:
    post:
      operationId: PostUserAuthForgotPassword
      tags: [user]
      summary: 忘记密码发码（恒 200 {sent:true}，反枚举——无论账号是否存在或邮件是否启用）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '200':
          description: 已发送（恒 {sent:true}）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SentResponse' }
        default:
          $ref: '#/components/responses/Error'
  /api/user/auth/reset-password:
    post:
      operationId: PostUserAuthResetPassword
