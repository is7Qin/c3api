        output_image_token_price_per_million: { type: number, format: double, minimum: 0, nullable: true, description: image token 输出价（USD per 1M image tokens——per-million 口径，与 pricings 字段语义一致；API 边界 ×1e5 → 毫分/1M）；缺省/null = 清空该分量 }
        output_cost_per_image: { type: number, format: double, minimum: 0, nullable: true, description: 每张图价（USD/张；API 边界 ×1e5 → 毫分/张——与 token 价同系数但单位语义独立：按张 flat，不走 /1e6 除法）；缺省/null = 清空该分量 }
