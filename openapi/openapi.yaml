        cache_read_per_m: { type: number, format: double, minimum: 0, nullable: true }
        cache_write_per_m: { type: number, format: double, minimum: 0, nullable: true }
        price_per_call: { type: number, format: double, minimum: 0, nullable: true }
        img_in_tok_per_m: { type: number, format: double, minimum: 0, nullable: true }
        img_out_tok_per_m: { type: number, format: double, minimum: 0, nullable: true }
        price_per_image: { type: number, format: double, minimum: 0, nullable: true }
    PriceEntryListResponse:
      type: object
