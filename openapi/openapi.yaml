    RedemptionCodeListResponse:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/RedemptionCode' }
    RedemptionUseListResponse:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/RedemptionUse' }
    RedemptionRecordListResponse:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/RedemptionRecord' }
    # --- 临时额度（/api/user/temp-balances + /api/admin/temp-balances，spec 2026-08-15） ---
    # 用户侧仅有效额度（amount > 0 且未过期，FEFO 同序）；管理侧全量视角。
    # amount_usd = 毫分 /1e5（API 边界换算，内部存储恒毫分）。
    TempBalanceRow:
      type: object
      required: [id, amount_usd, expires_at, note]
      properties:
        id: { type: integer, format: int64 }
        amount_usd: { type: number, format: double, description: "金额 USD（毫分 /1e5；1 USD = 100,000 毫分）" }
        expires_at: { type: string, format: date-time, nullable: true, description: 到期时间；null = 永久额度 }
        note: { type: string, nullable: true, description: 固定系统备注（signup bonus / redemption code），无敏感信息 }
    TempBalancesResponse:
      type: object
      required: [total_usd, rows]
      properties:
        total_usd: { type: number, format: double, description: 有效额度合计 USD（毫分 Σ /1e5；0 = 无有效额度） }
        rows:
          type: array
          items: { $ref: '#/components/schemas/TempBalanceRow' }
    AdminTempBalanceRow:
      type: object
      required: [id, user_id, amount_usd, expires_at, note, created_at]
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        amount_usd: { type: number, format: double, description: "金额 USD（毫分 /1e5；1 USD = 100,000 毫分）" }
        expires_at: { type: string, format: date-time, nullable: true, description: 到期时间；null = 永久额度 }
        note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    AdminTempBalancesResponse:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/AdminTempBalanceRow' }
    GenerateRequest:
      type: object
      required: [type, value]
      properties:
        type: { $ref: '#/components/schemas/RedemptionType' }
        value: { type: number, format: double, description: 面值：balance/temp_balance = USD；concurrency = 并发数（整数）。> 0 }
        remark: { type: string }
        expires_at: { type: string, format: date-time, description: 码未兑换即过期；缺省 = 永久 }
        resource_expires_at: { type: string, format: date-time, description: 兑换后资源到期；temp_balance 必填（决策 4） }
        max_uses: { type: integer, description: 1 = 单次码（缺省）；>1 = 多人码 }
        count: { type: integer, description: 生成个数 1-1000（缺省 1） }
    GenerateResponse:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          items: { $ref: '#/components/schemas/RedemptionCode' }
    DeactivateRequest:
      type: object
      description: 单码失效无请求体（保留空 schema 对齐批量端点命名）
    DeactivateResponse:
      type: object
      required: [deactivated]
      properties:
        deactivated: { type: boolean }
    BatchDeactivateRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: { type: integer, format: int64 }
          minItems: 1
          maxItems: 100
    BatchDeactivateResponse:
      type: object
      required: [deactivated]
      properties:
        deactivated: { type: integer, description: 新失效数（已 disabled no-op 不计） }
    # --- litellm 模型价格（Phase 5 计费价格来源） ---
    Provider:
      type: string
      description: 主流厂商枚举（litellm_provider 实际字符串，服务前端下拉框）。**litellm_provider 动态**——litellm 更新会加新厂商，此 enum 为主流集合；新厂商出现时扩 enum（DB 筛选不受限——自由字符串等值）
      enum: [openai, anthropic, azure, vertex_ai, bedrock, deepseek, mistral, cohere, xai, openrouter, groq, together_ai, fireworks_ai, replicate, huggingface, moonshot, zhipu, baidu, alibaba, meta, nvidia, cerebras, perplexity]
    PricingSource:
      type: string
      enum: [litellm, manual]
    Pricing:
      type: object
      required: [Model, PromptPricePerMillion, CompletionPricePerMillion, Source, CreatedAt, UpdatedAt]
      properties:
        Model: { type: string }
        PromptPricePerMillion: { type: number, format: double, description: "USD/1M tokens（API 边界换算；内部存储毫分——1 USD = 100,000 毫分）" }
        CompletionPricePerMillion: { type: number, format: double, description: "USD/1M tokens（API 边界换算；内部存储毫分——1 USD = 100,000 毫分）" }
        MaxInputTokens: { type: integer, format: int64, nullable: true, description: litellm 自带上下文窗口；nil = 未知 }
        MaxOutputTokens: { type: integer, format: int64, nullable: true }
        CacheReadPricePerMillion: { type: number, format: double, nullable: true, description: 缓存读取价（litellm cache_read_input_token_cost 换算）；nil = 无缓存价 }
        CacheCreationPricePerMillion: { type: number, format: double, nullable: true, description: 缓存写入价（litellm cache_creation_input_token_cost 换算）；nil = 无缓存价 }
        PriorityPromptPricePerMillion: { type: number, format: double, nullable: true, description: "service_tier=priority 单价替换档（OpenAI 专属：gpt-5 系列 priority 价；USD/1M tokens，内部存储毫分——1 USD = 100,000 毫分，API 边界换算）；nil = 无该档价，计费回退基础价" }
        PriorityCompletionPricePerMillion: { type: number, format: double, nullable: true }
        PriorityCacheReadPricePerMillion: { type: number, format: double, nullable: true }
        PriorityCacheCreationPricePerMillion: { type: number, format: double, nullable: true }
        FlexPromptPricePerMillion: { type: number, format: double, nullable: true, description: "service_tier=flex 单价替换档（OpenAI 专属：gpt-5.6-sol flex 价；USD/1M tokens，内部存储毫分——1 USD = 100,000 毫分，API 边界换算）；nil = 无该档价，计费回退基础价" }
        FlexCompletionPricePerMillion: { type: number, format: double, nullable: true }
        FlexCacheReadPricePerMillion: { type: number, format: double, nullable: true }
        FlexCacheCreationPricePerMillion: { type: number, format: double, nullable: true }
        FastMultiplier: { type: number, format: double, nullable: true, description: Anthropic 专属（claude 系列 Fast Mode 整单倍率，正常值 2.0 = ×2.0；fast 挡计费 = 基础价 × 此倍率；API 边界换算）；nil = 无倍率 }
        AboveThreshold: { type: integer, format: int64, nullable: true, description: 上下文分段阈值（tokens）；nil = 无分段 }
        AbovePromptPricePerMillion: { type: number, format: double, nullable: true, description: "超阈值分段价（基础组，USD/1M tokens（API 边界换算；内部存储毫分——1 USD = 100,000 毫分））；nil = 该分量不拆段" }
        AboveCompletionPricePerMillion: { type: number, format: double, nullable: true }
        AboveCacheReadPricePerMillion: { type: number, format: double, nullable: true }
        AboveCacheCreationPricePerMillion: { type: number, format: double, nullable: true }
        AbovePriorityPromptPricePerMillion: { type: number, format: double, nullable: true, description: 超阈值分段价（priority 组，azure 形态）；nil = 该档回退基础 above 组 }
        AbovePriorityCompletionPricePerMillion: { type: number, format: double, nullable: true }
        AbovePriorityCacheReadPricePerMillion: { type: number, format: double, nullable: true }
        AbovePriorityCacheCreationPricePerMillion: { type: number, format: double, nullable: true }
        AboveFlexPromptPricePerMillion: { type: number, format: double, nullable: true, description: 超阈值分段价（flex 组，gpt-5.6-sol 形态）；nil = 该档回退基础 above 组 }
        AboveFlexCompletionPricePerMillion: { type: number, format: double, nullable: true }
        AboveFlexCacheReadPricePerMillion: { type: number, format: double, nullable: true }
        AboveFlexCacheCreationPricePerMillion: { type: number, format: double, nullable: true }
        Provider: { allOf: [{ $ref: '#/components/schemas/Provider' }], nullable: true, description: litellm_provider（litellm 行才有；manual 行 nil） }
        Mode: { type: string, nullable: true, description: litellm mode（chat/completion/embedding 等） }
        SupportsPromptCaching: { type: boolean, nullable: true, description: litellm supports_prompt_caching }
        Source: { $ref: '#/components/schemas/PricingSource' }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
    PricingUpsert:
      type: object
      required: [prompt_price_per_million, completion_price_per_million]
      properties:
        prompt_price_per_million: { type: number, format: double, minimum: 0, description: "USD/1M tokens（API 边界换算；内部存储毫分——1 USD = 100,000 毫分）；≥ 0" }
        completion_price_per_million: { type: number, format: double, minimum: 0 }
        cache_read_price_per_million: { type: number, format: double, minimum: 0, nullable: true, description: "缓存读取价（USD/1M tokens；内部存储毫分——1 USD = 100,000 毫分，API 边界换算）；缺省 = 不设缓存价（落库 NULL）" }
        cache_creation_price_per_million: { type: number, format: double, minimum: 0, nullable: true, description: 缓存写入价；缺省 = 不设缓存价（落库 NULL） }
        priority_prompt_price_per_million: { type: number, format: double, minimum: 0, nullable: true, description: "service_tier=priority 单价替换档（OpenAI 专属：gpt-5 系列 priority 价；USD/1M tokens，内部存储毫分——1 USD = 100,000 毫分，API 边界换算）；缺省/null = 不设（落库 NULL，计费回退基础价）" }
        priority_completion_price_per_million: { type: number, format: double, minimum: 0, nullable: true }
        priority_cache_read_price_per_million: { type: number, format: double, minimum: 0, nullable: true }
        priority_cache_creation_price_per_million: { type: number, format: double, minimum: 0, nullable: true }
        flex_prompt_price_per_million: { type: number, format: double, minimum: 0, nullable: true, description: "service_tier=flex 单价替换档（OpenAI 专属：gpt-5.6-sol flex 价；USD/1M tokens，内部存储毫分——1 USD = 100,000 毫分，API 边界换算）；缺省/null = 不设（落库 NULL，计费回退基础价）" }
        flex_completion_price_per_million: { type: number, format: double, minimum: 0, nullable: true }
        flex_cache_read_price_per_million: { type: number, format: double, minimum: 0, nullable: true }
        flex_cache_creation_price_per_million: { type: number, format: double, minimum: 0, nullable: true }
        fast_multiplier: { type: number, format: double, minimum: 0, maximum: 10, nullable: true, description: Anthropic 专属（claude 系列 Fast Mode 整单倍率，正常值 0 < m ≤ 10，2.0 = ×2.0；fast 挡计费 = 基础价 × 此倍率；API 边界换算）；缺省/null = 不设 }
        above_threshold: { type: integer, format: int64, minimum: 0, nullable: true, description: 上下文分段阈值（tokens）；缺省/null = 不设（无分段） }
        above_prompt_price_per_million: { type: number, format: double, minimum: 0, nullable: true, description: "超阈值分段价（基础组，USD/1M tokens（API 边界换算；内部存储毫分——1 USD = 100,000 毫分））；缺省/null = 该分量不拆段" }
        above_completion_price_per_million: { type: number, format: double, minimum: 0, nullable: true }
        above_cache_read_price_per_million: { type: number, format: double, minimum: 0, nullable: true }
        above_cache_creation_price_per_million: { type: number, format: double, minimum: 0, nullable: true }
        above_priority_prompt_price_per_million: { type: number, format: double, minimum: 0, nullable: true, description: 超阈值分段价（priority 组，azure 形态）；缺省/null = 该档回退基础 above 组 }
        above_priority_completion_price_per_million: { type: number, format: double, minimum: 0, nullable: true }
        above_priority_cache_read_price_per_million: { type: number, format: double, minimum: 0, nullable: true }
        above_priority_cache_creation_price_per_million: { type: number, format: double, minimum: 0, nullable: true }
        above_flex_prompt_price_per_million: { type: number, format: double, minimum: 0, nullable: true, description: 超阈值分段价（flex 组，gpt-5.6-sol 形态）；缺省/null = 该档回退基础 above 组 }
        above_flex_completion_price_per_million: { type: number, format: double, minimum: 0, nullable: true }
        above_flex_cache_read_price_per_million: { type: number, format: double, minimum: 0, nullable: true }
        above_flex_cache_creation_price_per_million: { type: number, format: double, minimum: 0, nullable: true }
    PricingListResponse:
