        CacheWritePerM: { type: number, format: double, nullable: true }
        PricePerCall: { type: number, format: double, nullable: true }
        ImgInTokPerM: { type: number, format: double, nullable: true }
        ImgOutTokPerM: { type: number, format: double, nullable: true }
        PricePerImage: { type: number, format: double, nullable: true }
        Provider: { allOf: [{ $ref: '#/components/schemas/Provider' }], nullable: true }
