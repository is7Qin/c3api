# 自包含 e2e 专用基础设施栈（spec §3.3/§10）。
#
# 为什么必须自包含、不与 deploy/test-compose.yml 叠加：docker compose 的 ports 是
# **追加合并**语义——在 base 文件上叠加 override 仍会发布 base 的 15432/16379，
# 与共享 base 栈端口冲突。专用栈独立定义 db+redis、随机 host 端口
# （127.0.0.1:0:<container>），唯一 project 由 harness 用 -p e2e-<uuid8> 指定。
#
# 只供 e2e 使用：无数据卷声明（down -v 即彻底销毁）、redis 不落盘。
services:
  db:
    image: postgres:18-alpine
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: c3api
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:0:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:8-alpine
    restart: "no"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:0:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
